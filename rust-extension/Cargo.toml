[package]
name = "ai-search-extension"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
async-openai = { version = "0.40", features = ["model", "embedding", "chat-completion"] }
walkdir = "2"
blake3 = "1"
arrow-array = "58"
arrow-schema = "58"
lancedb = "0.30"
rusqlite = { version = "0.34", features = ["bundled"] }
chrono = "0.4"
image = "0.25"
rexif = "0.7"
bincode = "1"

[profile.release]
strip = true
